<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping God — BitkoopTurbo69 Coupon Oracle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="sg-wrap">
    <header class="sg-header">
      <div class="sg-logo">
        <span class="sg-logo-icon" aria-hidden="true">◇</span>
        <span class="sg-logo-text">Shopping God</span>
      </div>
      <p class="sg-tagline">AI coupon assistant · BitkoopTurbo69 · Find the best codes</p>
      <div class="sg-badges">
        <span class="sg-badge">Coupons</span>
        <span class="sg-badge">Merchants</span>
        <span class="sg-badge">Deals</span>
      </div>
    </header>

    <main class="sg-main">
      <section class="sg-search-section">
        <h2 class="sg-section-title">Ask the Oracle</h2>
        <form class="sg-search-form" id="sg-search-form">
          <div class="sg-input-group">
            <input type="text" id="sg-query" placeholder="e.g. electronics, free shipping, Zelpha…" autocomplete="off" />
            <button type="submit" class="sg-search-btn" aria-label="Search">Search</button>
          </div>
          <div class="sg-filters">
            <label class="sg-filter-label">
              <span>Category</span>
              <select id="sg-category">
                <option value="">Any</option>
                <option value="electronics">Electronics</option>
                <option value="fashion">Fashion</option>
                <option value="grocery">Grocery</option>
                <option value="travel">Travel</option>
                <option value="beauty">Beauty</option>
                <option value="home">Home</option>
              </select>
            </label>
            <label class="sg-filter-label">
              <span>Page size</span>
              <select id="sg-page-size">
                <option value="6">6</option>
                <option value="12" selected>12</option>
                <option value="24">24</option>
              </select>
            </label>
          </div>
        </form>
      </section>

      <section class="sg-results-section">
        <div class="sg-results-header">
          <h3 class="sg-results-title">Deals</h3>
          <p class="sg-results-meta" id="sg-results-meta">Run a search to see coupons.</p>
        </div>
        <div class="sg-results-grid" id="sg-results-grid">
          <div class="sg-empty-state" id="sg-empty-state">
